# LexMind AI — Render Blueprint (one-click deploy of the whole stack).
#
# Deploy: push this repo to GitHub, then in Render → "New" → "Blueprint" and
# point it at the repo. Render reads this file and provisions everything below.
# After the first deploy, set the secret env vars marked `sync: false` in each
# service's dashboard (they are intentionally NOT stored in git).
#
# See DEPLOYMENT.md for the full runbook, including the one-time pgvector
# extension and the restricted DB role.

databases:
  - name: lexmind-db
    databaseName: lexmind
    user: lexmind
    plan: basic-256mb # pgvector is available on Render Postgres; see DEPLOYMENT.md
    postgresMajorVersion: "16"

services:
  # --- API (FastAPI) ---------------------------------------------------------
  - type: web
    name: lexmind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/health
    # Run migrations, then start the API. On managed Postgres without a separate
    # restricted role, APP_DATABASE_URL is left empty and the app falls back to
    # DATABASE_URL (RLS still enforced in application queries). See DEPLOYMENT.md.
    dockerCommand: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexmind-db
          property: connectionString
      - key: APP_DATABASE_URL
        value: "" # fallback to DATABASE_URL; set a restricted-role URL to enforce RLS at the connection
      - key: REDIS_URL
        fromService:
          type: redis
          name: lexmind-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECURE_COOKIES
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none" # API and web are on different hosts, so the session cookie must be SameSite=None
      - key: CORS_ORIGINS
        sync: false # set to the web app's full origin after first deploy, e.g. https://lexmind-web.onrender.com
      - key: STORAGE_BACKEND
        value: local # swap to an S3-compatible backend for durable document storage
      # --- secrets: set these in the Render dashboard (never in git) ---------
      - key: ENCRYPTION_KEY
        sync: false # REQUIRED. Generate: uv run python -c "from app.core.crypto import generate_key; print(generate_key())"
      - key: AI_PROVIDER
        sync: false # "mock" or "openai"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: EMBEDDING_PROVIDER
        sync: false # "mock" or "voyage"
      - key: VOYAGE_API_KEY
        sync: false
      - key: LEGAL_SEARCH_PROVIDER
        sync: false # "none" or "tavily"
      - key: TAVILY_API_KEY
        sync: false

  # --- Frontend (Next.js) ----------------------------------------------------
  - type: web
    name: lexmind-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      # Baked into the client bundle at BUILD time. Set it to the API's full
      # origin and redeploy the web service once the API has a URL, e.g.
      # https://lexmind-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_ENV
        value: production

  # --- Celery worker (background jobs; optional) -----------------------------
  - type: worker
    name: lexmind-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    dockerCommand: uv run celery -A app.workers.celery_app.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lexmind-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ENCRYPTION_KEY
        sync: false

  # --- Redis (Celery broker + cache) -----------------------------------------
  - type: redis
    name: lexmind-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from other Render services
