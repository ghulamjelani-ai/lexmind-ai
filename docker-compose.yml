# LexMind AI — local development stack.
# Brings up the full platform: API, worker, web, Postgres+pgvector, Redis,
# object storage (MinIO) and a mail catcher (Mailpit).
#
#   cp .env.example .env            # adjust local credentials
#   docker compose up --build
#
# Credentials here are LOCAL DEV ONLY. Production uses a secrets manager.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexmind}
      POSTGRES_DB: ${POSTGRES_DB:-lexmind}
    ports:
      # Host 5433 -> container 5432, to avoid clashing with a local Postgres on
      # 5432. In-network services still reach it as db:5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # Runs migrations once (creates schema, the restricted lexmind_app role, and
  # RLS policies) before the API starts.
  migrate:
    build: ./backend
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lexmind}:${POSTGRES_PASSWORD:-lexmind}@db:5432/${POSTGRES_DB:-lexmind}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-lexmind_app}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Privileged connection (migrations already ran via the migrate service;
      # used here only for the pre-tenant auth bootstrap).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lexmind}:${POSTGRES_PASSWORD:-lexmind}@db:5432/${POSTGRES_DB:-lexmind}
      # Restricted, RLS-enforced connection for tenant-scoped request handling.
      APP_DATABASE_URL: postgresql+psycopg://lexmind_app:${APP_DB_PASSWORD:-lexmind_app}@db:5432/${POSTGRES_DB:-lexmind}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    command: ["uv", "run", "celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
